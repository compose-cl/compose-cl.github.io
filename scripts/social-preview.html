<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComposeCL social preview source</title>
  <style>
    @font-face{font-family:Lato;src:url('../static/fonts/Lato-Regular.ttf')}
    @font-face{font-family:Lato;src:url('../static/fonts/Lato-Bold.ttf');font-weight:700}
    *{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#f7f9fc;font-family:Lato,Arial,sans-serif;color:#232b36;padding:48px 65px}
    .brand{display:flex;align-items:center;gap:14px;font-size:25px;font-weight:700}.brand img{width:40px}.brand span{color:#2a78d6}.institution{margin-left:auto;font-size:17px;font-weight:400;color:#596270}
    h1{font-size:51px;line-height:1.16;letter-spacing:-1.2px;margin:38px 0 21px;max-width:1060px}p{font-size:23px;color:#596270;margin:0}
    .metrics{display:flex;gap:64px;border-top:1px solid #dce3ed;padding-top:28px;margin-top:32px}.metric{flex:1}.metric strong{display:block;font-size:47px;color:#2a78d6;line-height:1.1;margin-bottom:8px}.metric span{font-size:18px;color:#424d5b}.address{margin-top:30px;font-size:16px;color:#596270}
  </style>
</head>
<body>
  <div class="brand"><img src="../static/images/favicon.svg" alt=""><div>Compose<span>CL</span></div><div class="institution">Johns Hopkins University</div></div>
  <h1>Continual Learning Mechanisms Compose for Long-Horizon Memorization</h1>
  <p>Three anchors. Low-rank allocation. Longer-lasting memory.</p>
  <div class="metrics"><div class="metric"><strong>34.9%</strong><span>Average final retention</span></div><div class="metric"><strong>Top 3</strong><span>On all three datasets</span></div><div class="metric"><strong>100 tasks</strong><span>Per dataset</span></div></div>
  <div class="address">compose-cl.github.io</div>
</body>
</html>
