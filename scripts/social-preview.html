<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComposeCL social preview source</title>
  <style>
    @font-face{font-family:Lato;src:url('../static/fonts/Lato-Regular.ttf')}
    @font-face{font-family:Lato;src:url('../static/fonts/Lato-Bold.ttf');font-weight:700}
    *{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#fff;font-family:Lato,Arial,sans-serif;color:#232b36;padding:32px 52px}
    .brand{display:flex;align-items:center;gap:12px;font-size:23px;line-height:1.2;font-weight:700}.brand img{width:32px;height:32px}.brand span{color:#2a78d6}.institution{margin-left:auto;font-size:16px;font-weight:400;color:#596270}
    h1{font-size:42px;line-height:1.12;letter-spacing:-.9px;margin:20px 0 12px}h1 span{display:block;white-space:nowrap}
    .summary{font-size:23px;line-height:1.32;color:#445163;margin:0;text-wrap:balance}.summary strong{font-weight:700;color:#232b36}
    .diagram{display:block;width:100%;height:auto;margin-top:20px}.address{margin-top:16px;font-size:14px;line-height:1.3;color:#596270}
  </style>
</head>
<body>
  <div class="brand"><img src="../static/images/favicon.svg" alt=""><div>Compose<span>CL</span></div><div class="institution">Johns Hopkins University</div></div>
  <h1><span>Continual Learning Mechanisms Compose</span><span>for Long-Horizon Memorization</span></h1>
  <p class="summary">Composing three anchors with merged LoRA substantially improves average final retention after 100 tasks from 1.2% to 34.9%, a <strong>28</strong>-fold improvement.</p>
  <img class="diagram" src="../static/images/anchors-allocation.png" width="2400" height="626" alt="The two design dimensions: data, function, and weight anchors jointly constrain the update, while shared and merged LoRA determine how updates are retained.">
  <div class="address">compose-cl.github.io</div>
</body>
</html>
